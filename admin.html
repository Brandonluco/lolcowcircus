<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Admin Panel</title>
    <link rel="stylesheet" href="admin.css">
</head>

<body>

<h1>CowTube Admin Panel</h1>

<div class="admin-layout">
    <div class="admin-left">

<section>
    <h2>Streamer Manager</h2>

    <label>
        Select Streamer:
        <select id="streamerSelect"></select>
    </label>

    <br><br>

    <button id="onlineButton">🟢 Online</button>
    <button id="awayButton">🟡 Away</button>
    <button id="offlineButton">⚫ Offline</button>

</section>


<section>
    <h2>Add / Edit Streamer</h2>

    <div id="streamerEditingStatus" style="display:none;"></div>

    <input type="text" id="streamerName" placeholder="Streamer name">

    <input type="text" id="streamerPlatform" placeholder="Platform">

    <input type="text" id="streamerChannel" placeholder="Channel / Handle">

    <input type="text" id="streamerEmbedChannelId" placeholder="YouTube Channel ID (optional, for live embed — starts with UC...)">

    <input type="text" id="streamerKickChannel" placeholder="Kick username (optional, lowercase, no @)">

    <select id="streamerStatus">
        <option value="online">🟢 Online</option>
        <option value="away">🟡 Away</option>
        <option value="offline">⚫ Offline</option>
    </select>

    <button id="addStreamer">
        Add Streamer
    </button>

    <button id="cancelStreamerEdit" style="display:none;">
        Cancel Edit
    </button>

</section>

<section>
    <h2>Alert Manager</h2>


    <div id="currentAlert">
    No active alert
    </div>

    <input type="text" id="alertMessage" placeholder="Alert message">

    <select id="alertType">
        <option value="news">🟢 News</option>
        <option value="maintenance">🔴 Maintenance</option>
    </select>

    <button id="updateAlert">
        Update Alert
    </button>

    <button id="clearAlert">
    Clear Alert
</button>

</section>

<section>
    <h2>Current Streamers</h2>

    <div id="streamerList"></div>

</section>

</div>

<div class="admin-right">

<section class="article-manager" id="article-manager">
    <h2>Article Manager</h2>

    <div id="editingStatus" style="display:none;"></div>

    <input type="text" id="articleTitle" placeholder="Article title">

    <label for="articleStreamer">Streamer (optional):</label>
    <select id="articleStreamer">
        <option value="">— No streamer —</option>
    </select>

    <input type="text" id="articleDate" placeholder="Date">

    <textarea id="articleContentTop" placeholder="Paragraph above media"></textarea>

    <label for="articleImageFile">Upload image from your computer:</label>
    <input type="file" id="articleImageFile" accept="image/*">
    <div id="imageUploadStatus"></div>

    <input type="hidden" id="articleImage">

    <input type="text" id="articleYoutube" placeholder="YouTube link">

    <textarea id="articleContentBottom" placeholder="Paragraph below media"></textarea>

    <button id="addArticle">
        Publish Article
    </button>
     
    <button id="cancelEdit" style="display:none;">
    Cancel Edit
</button>
  

<h3>Current Articles</h3>

<div id="articleList"></div>

</section>


</div> <!-- closes admin-right -->

</div> <!-- closes admin-layout -->

<section class="admin-comments">

    <h2>Article Comments</h2>

    <div id="articleCommentList"></div>

</section>

<section class="admin-comments">

    <h2>Banned IPs</h2>

    <div id="bannedIpList"></div>

</section>

<script src="data.js"></script>
<script src="admin.js"></script>

</body>
</html>
