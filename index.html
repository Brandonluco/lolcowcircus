<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CowTube | Where Cows Come to Roam</title>
    <!-- Includes the metadata profile you liked from the example -->
    <link rel="profile" href="http://gmpg.org">
    <link rel="stylesheet" href="style.css">
    <link rel="icon" type="image/png" href="/Images/Favicon/faviconnew.png">
</head>
<body>

    <!-- Main Navigation Header -->
<header class="site-header expanded">

    <img class="header-background" src="Images/Banner/CowTubeClean.png">
    
    <div class="banner-easter-egg">
    <img class="banner-fox" src="Images/Banner/fox.svg" alt="fox">
    <img class="banner-bush" src="Images/Banner/bush.png" alt="bush">
</div>


    <a href="mailto:underground@cowtube.org" class="cloud-button cloud-contact">
    <img src="Images/Banner/cloud3.png" alt="Contact">
    <span>Contact</span>
</a>

<a href="#" class="cloud-button cloud-articles">
    <img src="Images/Banner/cloud2.png" alt="Articles">
    <!--<span>Articles</span>-->
</a>

<a href="FAQ.html" class="cloud-button cloud-about">
    <img src="Images/Banner/cloud3.png" alt="About">
    <span>FAQ</span>
</a>




    <div class="logo">
    </div>


   

</header>
<!-- Shown only on portrait phones, when the banner (and its cloud links) are hidden -->
<nav class="mobile-nav">
    <a href="mailto:underground@cowtube.org">Contact</a>
    <a href="FAQ.html">FAQ</a>
</nav>
<div class="status-banner">
    <div class="status-track" id="statusTrack"></div>
</div>
<div id="alertBox" style="display:none;"></div>
    <!-- Main Layout Container -->
    <div class="container">
        <main class="content-area">
<div id="articles-container"></div>
        </main>
        
     <aside class="chat">
        
    <div class="chat-header">
        Community Chat
    </div>

    <div id="identity-card">

        <button id="close-identity-card">×</button>

        <h3>Welcome to Community Chat</h3>

        <p>
            You are currently:
            <strong id="current-chat-name"></strong>
        </p>

        <p>
            Want people to recognize you?
            Choose a display name.
        </p>

        <button id="choose-name-button">
            Choose Display Name
        </button>

        <div id="name-change-box" style="display:none;">

    <input 
        id="name-input" 
        type="text" 
        placeholder="Enter display name..."
        maxlength="20"
    >

    <button id="save-name-button">
        Save Name
    </button>

</div>

    </div>


    <div id="chat-messages" class="chat-messages">

    <div class="message">
        <strong>Guest_123:</strong> Welcome everyone!
    </div>

    <div class="message">
        <strong>Guest_456:</strong> Hey, glad to be here.
    </div>

</div>

<div class="chat-input">
      <input id="message-input" type="text" placeholder="Type a message...">
<button id="send-button">Send</button> 
 
<div id="new-message-alert">
    New message ↓
</div>

</aside>
    </div>

    <!-- Footer -->
    <footer class="site-footer">
        <p>&copy; 2026 CowTube. All rights reserved.</p>
    </footer>

    <!-- Script file for our anti-copy features later -->
  <script src="streamers.js"></script>
<script src="data.js"></script>
<script src="script.js"></script>















</body>
</html>
