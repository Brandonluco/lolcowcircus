<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CowTube | Where Cows Come to Roam</title>
    <!-- Includes the metadata profile you liked from the example -->
    <link rel="profile" href="http://gmpg.org">
    <link rel="stylesheet" href="style.css">
    <link rel="icon" type="image/png" href="/Images/Favicon/faviconnew.png">
</head>
<body>

    <!-- Main Navigation Header -->
<header class="site-header expanded">

    <img class="header-background" src="Images/Banner/CowTubeRS.jpeg" alt="">

    <a href="/" class="screen-button screen-home" aria-label="Home">
        <svg class="screen-outline" viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true">
            <polygon points="10,8 90,8 100,82 20,95"></polygon>
        </svg>
    </a>
    <a href="/streamers" class="screen-button screen-streamers" aria-label="Streamers">
        <svg class="screen-outline" viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true">
            <polygon points="8,18 100,6 117,76 30,98"></polygon>
        </svg>
    </a>
    <a href="FAQ.html" class="screen-button screen-faq" aria-label="FAQ">
        <svg class="screen-outline" viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true">
            <polygon points="-15,2 75,-8 76,100 -15,98"></polygon>
        </svg>
    </a>
    <a href="mailto:underground@cowtube.org" class="screen-button screen-contact" aria-label="Contact">
        <svg class="screen-outline" viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true">
            <polygon points="-26,10 60,20 46,97 -36,75"></polygon>
        </svg>
    </a>

</header>
<!-- Shown only on portrait phones, when the banner (and its cloud links) are hidden -->
<nav class="mobile-nav">
    <a href="mailto:underground@cowtube.org">Contact</a>
    <a href="/streamers">Streamers</a>
    <a href="FAQ.html">FAQ</a>
</nav>
<div class="status-banner">
    <div class="status-track" id="statusTrack"></div>
</div>
<div id="alertBox" class="hidden"></div>

    <!-- Left-side quick-nav bubbles — fade in the moment the banner
         collapses (see syncHeaderState in script.js), so Streamers/FAQ/
         Contact stay reachable without scrolling back to the top. No Home
         bubble since you're already on the homepage here, and this markup
         only exists on this page — the FAQ/Streamer pages are short
         enough that the banner and its buttons never leave view. Same
         sticky-in-flow mechanism as .ad-banner-side just below, so it
         never shifts anything else on the page. -->
    <nav class="scroll-nav-bubbles" id="scrollNavBubbles" aria-label="Quick navigation">
        <a href="/streamers" class="nav-bubble" aria-label="Streamers">📺</a>
        <a href="FAQ.html" class="nav-bubble" aria-label="FAQ">❓</a>
        <a href="mailto:underground@cowtube.org" class="nav-bubble" aria-label="Contact">✉️</a>
    </nav>

    <!-- Side archive promo banner — sits in the normal page flow right
         here (below the header/ticker/alert) and uses position: sticky,
         same mechanism as the chat + featured videos sidebar, so it
         behaves identically: starts in place, sticks once you scroll
         to it, never needs to fight the header for stacking order. -->
    <a href="https://archive.org/details/@cowtube"
       target="_blank"
       rel="noopener"
       class="ad-banner ad-banner-side"
       aria-label="Download archived videos on archive.org">
        <img src="Images/Articles/Ads/CowTubeSideBanner.svg" alt="">
        <img src="Images/Articles/Ads/CowTubeSideBannerInvert.svg" alt="">
    </a>
    <!-- Main Layout Container -->
    <div class="container">
        <main class="content-area">
<div id="featured-streamer-container"></div>
<div id="articles-container"></div>
        </main>
        
     <aside class="sidebar">

    <div class="chat">

    <div class="chat-header">
        Community Chat
    </div>

    <div id="identity-card">

        <button id="close-identity-card">×</button>

        <h3>Welcome to Community Chat</h3>

        <p>
            You are currently:
            <strong id="current-chat-name"></strong>
        </p>

        <p>
            Want people to recognize you?
            Choose a display name.
        </p>

        <button id="choose-name-button">
            Choose Display Name
        </button>

        <div id="name-change-box" class="hidden">

    <input 
        id="name-input" 
        type="text" 
        placeholder="Enter display name..."
        maxlength="20"
    >

    <button id="save-name-button">
        Save Name
    </button>

</div>

    </div>


    <div id="chat-messages" class="chat-messages">

    <div class="message">
        <strong>Guest_123:</strong> Welcome everyone!
    </div>

    <div class="message">
        <strong>Guest_456:</strong> Hey, glad to be here.
    </div>

</div>

<div class="chat-input">
      <input id="message-input" type="text" placeholder="Type a message..." maxlength="500">
<button id="send-button">Send</button>
<span id="chatCharCount" class="chat-char-count">0 / 500</span>
<div id="new-message-alert">
    New message ↓
</div>

</div>

    </div>

    <div class="featured-videos-box">

        <div class="chat-header">
            Featured Videos
        </div>

        <div id="featured-videos-list" class="featured-videos-list">
        </div>

    </div>

    <a href="stock.html" class="stock-graph-box" aria-label="View full streamer stock history">

        <div class="chat-header">
            Streamer Stock
        </div>

        <div id="stock-graph-mini" class="stock-graph-mini">
        </div>

    </a>

</aside>
    </div>

    <!-- =====================================================
         ARCHIVE PROMO BANNER (bottom)
         Links to an archive.org page — set ARCHIVE_URL below.
         Crossfades between a black-and-white and an inverted version
         of the same image, gently, on a loop. Hidden automatically on
         screens too narrow to fit it without crowding site content.
         ====================================================== -->

  

    <a href="https://archive.org/details/@cowtube"
       target="_blank"
       rel="noopener"
       class="ad-banner ad-banner-bottom"
       aria-label="Download archived videos on archive.org">
        <img src="Images/Articles/Ads/CowTubeNewBotAd.png" alt="">
        <img src="Images/Articles/Ads/CowTubeNewBotAdInvert.png" alt="">
    </a>

  <!-- Footer -->
    <footer class="site-footer">
        <p>&copy; 2026 CowTube. All rights reserved.</p>
    </footer>

    <!-- Script file for our anti-copy features later -->
  <script src="streamers.js"></script>
<script src="data.js"></script>
<script src="stock-charts.js"></script>
<script src="script.js"></script>















</body>
</html>
