name = "cowtube"
main = "worker.js"
compatibility_date = "2026-08-09"

# Without this, every GitHub-triggered deploy wipes out any variables/secrets
# added through the Cloudflare dashboard (like KICK_CLIENT_ID/SECRET) that
# aren't declared in this file. This tells the deploy to leave them alone.
keep_vars = true

[assets]
directory = "."
binding = "ASSETS"
run_worker_first = ["/"]

[[d1_databases]]
binding = "DB"
database_name = "cowtube-db"
database_id = "4a20d5b4-2525-4649-8837-1b104de7a8bc"

[[durable_objects.bindings]]
name = "CHAT_ROOM"
class_name = "ChatRoom"

[[r2_buckets]]
binding = "IMAGES"
bucket_name = "cowtube-images"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["ChatRoom"]

[triggers]
# Checks every YouTube streamer's live status every 5 minutes.
crons = ["*/5 * * * *"]

[observability]
enabled = true

[observability.logs]
enabled = true

[vars]
ACCESS_TEAM_DOMAIN = "autumn-mode-ef6c.cloudflareaccess.com"
ACCESS_AUD = "d0235f2052a51413391d827847157efd6250705d593fd79c8fdaa7df86051ee6"